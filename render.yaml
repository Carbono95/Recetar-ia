databases:
  - name: recetaria-db
    plan: free
    databaseName: recetaria
    user: recetaria

services:
  - type: web
    name: recetaria-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recetaria-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: MEDIA_DIR
        value: ./media
      - key: CORS_ORIGINS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
